name: hello-ci

on:
  workflow_dispatch:

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - hello/**

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: hello/go.mod
        cache-dependency-path: hello/go.sum

    - name: Use Go Workspace
      run: go work use ./hello ./morestrings

    - name: Test
      run: go test -v ./hello/...
