name: hello-ci

on:
  workflow_dispatch:

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - hello/**

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: hello/go.mod
          cache-dependency-path: hello/go.sum

      - name: Use Go Workspace
        run: go work use ./hello ./morestrings

      - name: Test
        run: go test -v ./hello/...

  status-check:
    # WARNING: DO NOT change this job name. It is hooked up to the status check UI.
    name: Status Check
    runs-on: ubuntu-latest
    needs:
      - test
    if: always()
    steps:
      - name: Evaluate triggered jobs status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::Failing run due to job failure"
            exit 1
          fi
          echo "All jobs succeeded"
