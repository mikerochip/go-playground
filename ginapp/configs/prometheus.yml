# from https://github.com/grafana/tempo/blob/main/example/docker-compose/shared/prometheus.yaml

global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ localhost:9090 ]
  - job_name: tempo
    static_configs:
      - targets: [ tempo:3200 ]
  - job_name: otelcol
    static_configs:
      - targets: [ otelcol:8889 ]

# see https://prometheus.io/docs/guides/opentelemetry/#enable-out-of-order-ingestion
storage:
  tsdb:
    out_of_order_time_window: 30m

otlp:
  # Recommended attributes to be promoted to labels.
  # see https://prometheus.io/docs/guides/opentelemetry/#promoting-resource-attributes
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
