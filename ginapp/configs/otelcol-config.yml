receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

  resource:
    attributes:
      - key: service.namespace
        value: go-playground
        action: upsert

exporters:
  otlp:
    endpoint: otelcol:4317
  otlphttp/loki:
    # the Collector will append /v1/logs
    endpoint: http://loki:3100/otlp
  debug:
    #verbosity: basic
    verbosity: normal
    #verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters:
        - debug
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - debug
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters:
        - debug
        - otlphttp/loki
