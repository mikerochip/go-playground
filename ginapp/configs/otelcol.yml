receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog:
    include:
      #- /var/log/pods/*/*/*.log   # Kubernetes pod logs
      - /var/log/*.log
    start_at: beginning

processors:
  batch:
  resource:
    attributes:
      - key: service.namespace
        value: go-playground
        action: upsert

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
  debug:
    #verbosity: basic
    verbosity: normal
    #verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters:
        - debug
        - otlp/tempo
    logs:
      receivers: [otlp, filelog]
      processors: [resource, batch]
      exporters:
        - debug
        - otlphttp/loki
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - debug
        - otlphttp/prometheus
