receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  resource:
    attributes:
      - key: service.namespace
        value: go-playground
        action: upsert
      - key: service.name
        value: ginapp
        action: upsert
      - key: deployment.environment.name
        value: dev
        action: upsert

exporters:
  otlp:
    #endpoint: otelcol:4317
    endpoint: otelcol:4318
  # dump traces/logs to collector to stdout
  debug: {}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # pprof:
  #   endpoint: 0.0.0.0:1777
  # zpages:
  #   endpoint: 0.0.0.0:55679

service:
  extensions:
    - health_check
    # - pprof
    # - zpages
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      #exporters: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      #exporters: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      #exporters: [otlp]
      exporters: [debug]
