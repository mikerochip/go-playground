services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.135.0
    pull_policy: missing
    command: ["--config=/etc/otelcol/otel-collector-config.yml"]
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension
    volumes:
      #- ./otel-collector-config.yml:/etc/otelcol/otel-collector-config.yml:ro
      - type: bind
        bind:
          create_host_path: false
        read_only: true
        source: ./otel-collector-config.yml
        target: /etc/otelcol/otel-collector-config.yml
    restart: unless-stopped

  ginapp:
    build:
      context: .
      dockerfile: ./Dockerfile
    pull_policy: build
    environment:
      # standard otel env to tell it the sdk to send to this endpoint
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      OTEL_LOG_LEVEL: debug
    depends_on:
      - otelcol
    ports:
      - 8080:8080
